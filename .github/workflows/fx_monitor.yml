name: JPY CNY FX Monitor
run-name: JPY/CNY monitor — ${{ github.event_name }}

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'monitor'
        type: choice
        options:
          - monitor
          - test-email

permissions:
  contents: write

concurrency:
  group: jpy-cny-fx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run FX monitor
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'monitor' }}"
          python fx_monitor.py "$MODE"

      - name: Persist FX alert state
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'monitor' }}
        run: |
          if git diff --quiet -- fx_state.json; then
            echo "No FX state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx_state.json
          git commit -m "Update FX alert state"
          git push
