name: FUJIFILM Stock Monitor
run-name: FUJIFILM monitor — ${{ github.event_name }}

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'monitor'
        type: choice
        options:
          - monitor
          - test-notify

permissions:
  contents: write

concurrency:
  group: fujifilm-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'monitor' }}"
          python monitor.py "$MODE"

      - name: Persist state changes
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'monitor' }}
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update stock state"
          git push
